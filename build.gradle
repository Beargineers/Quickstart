/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false

    // BearPlatform: robot code in Kotlin. At least the Kotlin version BearPlatform was built with.
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false

    // BearPlatform's tasks that talk to the robot: sendConfig, robotCommand, downloadMatchLogs.
    // Keep it at the same version as BearPlatform in TeamCode/build.gradle.
    id 'nl.beargineers.platform' version '0.2.0' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}
