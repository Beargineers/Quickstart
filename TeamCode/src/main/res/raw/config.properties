# The robot's settings, read at INIT of every opmode.
#
# With the laptop on the robot's WiFi, http://192.168.43.1:8080/bear/config shows every setting the robot has, with
# its default, and changes them live: no rebuilding, they apply right away, even in a running opmode. They stay on the
# robot until the next install, so download the edited file from that page and copy it over this one to keep them.
#
# Plain numbers are cm for distances and degrees for angles; units work too: 4.5in, 300ms, 90deg.
# Comments go on their own lines: text after a value becomes part of the value.

# Drivetrain: motors leftFront, rightFront, leftBack and rightBack in the robot configuration.
# Driving's Back button turns each wheel in turn: each should turn so it would push the robot forward. The left motors
# start reversed (R) and the right ones forward (F); flip one that turns backward:
# drive.leftFront.direction = F
# For the first tries, everything at a third of the power:
# drive.maxPower = 0.3

# Powers are scaled to a 12 V battery, so Auto drives the same on a full battery as on a tired one
drive.nominalVoltage = 12

# Odometry: a goBILDA Pinpoint named pinpoint in the robot configuration, with FOUR_BAR or SWINGARM pods.
localizer.pods = FOUR_BAR
# Where the pods are; measure them on your robot. The forward pod's distance left of the robot's center (negative
# when right of it), the strafe pod's distance forward of the center (negative when behind it).
localizer.forwardPodLeft = 0
localizer.strafePodForward = 0
# The pose on the Driver Station should grow in x when you push the robot forward, and in y when you push it to its
# left. A pod counting the wrong way:
# localizer.forwardPodDirection = REVERSED
# localizer.strafePodDirection = REVERSED

# Path following: the defaults were tuned on a 12 kg mecanum robot. To tune yours, watch the graphs at
# http://192.168.43.1:8080/bear/graphs while Auto drives, and change these live:
# follower.forwardGains = p=0.03, i=0.002, d=0.005
# follower.strafeGains = p=0.045, d=0.006
# follower.headingGains = p=0.04, i=0.015, d=0.004
